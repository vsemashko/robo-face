<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robo-Face</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <canvas id="canvas"></canvas>

        <!-- Debug info (hidden in production) -->
        <div id="debug-info" class="debug-info">
            <div class="debug-item">
                <span class="label">Character:</span>
                <span id="debug-character">robo-face</span>
            </div>
            <div class="debug-item">
                <span class="label">State:</span>
                <span id="debug-state">idle</span>
            </div>
            <div class="debug-item">
                <span class="label">FPS:</span>
                <span id="debug-fps">0</span>
            </div>
            <div class="debug-item">
                <span class="label">Connection:</span>
                <span id="debug-connection">disconnected</span>
            </div>
        </div>

        <!-- Character selector (hidden in production) -->
        <div id="character-selector" class="character-selector">
            <h3>Character</h3>
            <div class="character-buttons">
                <button onclick="window.app.switchCharacter('robo-face')" class="char-btn active" data-char="robo-face">
                    🤖 Robo-Face
                </button>
                <button onclick="window.app.switchCharacter('cat-face')" class="char-btn" data-char="cat-face">
                    🐱 Cat-Face
                </button>
                <button onclick="window.app.switchCharacter('pixel-friend')" class="char-btn" data-char="pixel-friend">
                    👾 Pixel-Friend
                </button>
            </div>
        </div>

        <!-- Voice controls (hidden in production and if voice disabled) -->
        <div id="voice-controls" class="voice-controls" style="display: none;">
            <h3>Voice Chat</h3>
            <button id="voice-btn" class="voice-btn" onclick="window.app.toggleVoice()">
                🎤 Push to Talk
            </button>
            <div id="voice-status" class="voice-status">
                Voice: Disabled
            </div>
            <button class="voice-clear-btn" onclick="window.app.clearVoiceHistory()">
                Clear History
            </button>
        </div>

        <!-- Test controls (hidden in production) -->
        <div id="test-controls" class="test-controls">
            <h3>Emotions</h3>
            <div class="button-grid">
                <button onclick="window.app.triggerEmotion('idle')">Idle</button>
                <button onclick="window.app.triggerEmotion('happy')">Happy</button>
                <button onclick="window.app.triggerEmotion('thinking')">Thinking</button>
                <button onclick="window.app.triggerEmotion('alert')">Alert</button>
                <button onclick="window.app.triggerEmotion('sad')">Sad</button>
                <button onclick="window.app.triggerEmotion('surprised')">Surprised</button>
                <button onclick="window.app.triggerEmotion('sleeping')">Sleeping</button>
                <button onclick="window.app.triggerEmotion('excited')">Excited</button>
                <button onclick="window.app.triggerEmotion('confused')">Confused</button>
                <button onclick="window.app.triggerEmotion('angry')">Angry</button>
                <button onclick="window.app.triggerEmotion('loving')">Loving</button>
                <button onclick="window.app.triggerEmotion('bored')">Bored</button>
                <button onclick="window.app.triggerEmotion('curious')">Curious</button>
                <button onclick="window.app.triggerEmotion('scared')">Scared</button>
            </div>
        </div>
    </div>

    <!-- Load modules -->
    <script src="js/renderer.js"></script>
    <script src="js/animator.js"></script>

    <!-- Load character system -->
    <script src="js/characters/base-character.js"></script>
    <script src="js/characters/robo-face.js"></script>
    <script src="js/characters/cat-face.js"></script>
    <script src="js/characters/pixel-friend.js"></script>
    <script src="js/character-manager.js"></script>

    <script src="js/websocket-client.js"></script>
    <script src="js/voice-client.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
